[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoclaw"
version = "0.2.0"
description = "多渠道可执行型 Agent 引擎：工具调度、人工确认、全链路追踪、流式输出"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "httpx>=0.27",
    "html2text>=2024.2.26",
    "ddgs>=9.0",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12.0",
    "lark-oapi>=1.3",
    "qq-botpy>=1.2",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]
# 装了 jieba 时中文分词更好；没装会自动退化成 2-gram（见 agent/memory_store.py）
cn = ["jieba>=0.42"]

# 显式声明要打包的 Python 包。
# 不写的话 setuptools 用自动发现，会把 tests/ 之类也扫进来，
# 扁平布局下还可能把顶层脚本当模块混进去，行为不确定。
# 这里只列真正需要被 import 的包；main.py / config.py 是入口脚本，不进包。
[tool.setuptools]
packages = ["agent", "agent.tools", "bus", "channels", "providers", "session"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
# 测试全部离线运行，不需要网络标记

# ---------------------------------------------------------------------------
# ruff（静态检查 + 格式化）
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "workspace",
    "__pycache__",
    ".venv",
    "mcp_servers/poetry_server.py",  # 示例 Server，风格不强制
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear（常见陷阱）
    "UP",  # pyupgrade
    "C4",  # comprehension
    "SIM", # simplify
]
ignore = [
    "E501",  # 行长交给 formatter
    "B008",  # 函数默认参数调用（FastAPI 风格需要）
    "SIM108",# 三元表达式不一定更好读
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]  # 测试里 assert False 之类是故意的

# ---------------------------------------------------------------------------
# mypy（类型检查，基线模式：先保证能跑起来，不追求全绿）
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["workspace/", "mcp_servers/"]

[[tool.mypy.overrides]]
module = ["mcp.*", "lark_oapi.*", "botpy.*", "ddgs.*", "html2text.*", "jieba.*"]
ignore_missing_imports = true
